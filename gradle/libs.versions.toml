[versions]
# Versions live-checked against Maven Central / gradle.org at scaffold
# time (2026-11-09): every entry was the latest stable that day.
kotlin = "2.4.21"
serialization = "1.12.0"
ktor = "3.6.1"
clikt = "5.1.0"
junit = "6.1.3"
slf4j = "2.0.20"
sqlite-jdbc = "3.54.1.0"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
# Ktor logs via SLF4J; nop binding silences its "no provider" stderr noise.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
