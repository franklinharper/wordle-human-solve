# Gradle house settings (from the VPS Kotlin house standard).
# The daemon spec is the JVM cluster's shared spec (Frank, 2026-11-17):
# it must match exactly in every JVM-cluster repo so all of them reuse
# the one daemon in ~/.gradle-jvm. Cap the heap explicitly.
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
kotlin.incremental=true
